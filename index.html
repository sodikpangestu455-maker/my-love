      <style>

          height: 100vh;
          margin: 0;

          text-align: center;
          width: 90%;
          max-width: 350px;

          width: 100%;
          padding: 12px;
          border-radius: 8px;

          margin-top: 10px;
          text-align: center;
          font-size: 18px;
          letter-spacing: 5px;
          background: #2a3942;
          color: white;
        }
        button {
          width: 100%;
          padding: 12px;
          margin-top: 15px;
          border: none;
          border-radius: 8px;
          background: #25D366;
          color: white;
          font-weight: bold;
          font-size: 16px;
          cursor: pointer;
        }
        .content { display: none; }
        .content img {
          width: 100%;
          border-radius: 15px;
          margin-bottom: 15px;
          box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }
        .error { color: #ff4d4d; margin-top: 10px; display: none; }
      </style>
